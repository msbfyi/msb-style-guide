name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm Trusted Publishing (OIDC)

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Publishing has to happen as steps in *this* job, not a separate
      # workflow reacting to the `release` event — a release created by
      # this job's own GITHUB_TOKEN doesn't fire other workflows' `on:
      # release` triggers (GitHub's anti-recursion safeguard for
      # token-authored events). This is release-please-action's own
      # documented pattern for exactly this reason.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          # npm Trusted Publishing (OIDC) needs npm >=11.5.1 / Node
          # >=22.14 — overridden here rather than in .nvmrc, since that
          # pins Node 20 for the rest of CI/dev and there's no reason to
          # move everything just for this one publish step's OIDC need.
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      # Node 22's *bundled* npm lags well behind npm's own release
      # cadence (v22.23.2 ships npm 10.9.8) — nowhere near the >=11.5.1
      # Trusted Publishing needs. Confirmed this bit us for real: the
      # v1.0.1 release published successfully but silently through the
      # NODE_AUTH_TOKEN fallback instead of OIDC (no dist.attestations
      # on the published version), because the CLI itself was too old
      # to attempt OIDC at all — not a config problem, a version one.
      - run: npm install -g npm@^11.5.1
        if: ${{ steps.release.outputs.release_created }}
      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}
      - run: npm run build
        if: ${{ steps.release.outputs.release_created }}
      # A NODE_AUTH_TOKEN present in the environment makes the npm CLI
      # just use it and never attempt OIDC at all — confirmed for real:
      # v1.0.1 and v1.0.2 both published fine but through the token
      # (npm's own "tokens that bypass 2FA are being restricted" notice
      # in the log, and no dist.attestations on either published
      # version — Trusted Publishing auto-generates one, a token-based
      # publish doesn't), despite id-token: write and a correctly-
      # configured trusted publisher. "Auto-detects OIDC... before
      # falling back to tokens" apparently means "no token configured
      # at all", not "tries OIDC first even with one present".
      #
      # So: attempt npm publish with no token in scope at all — a real
      # OIDC-only attempt — and only fall back to NPM_TOKEN if that
      # actually fails (misconfigured/revoked trusted publisher, etc.).
      - name: Publish to npm (OIDC, falling back to NPM_TOKEN)
        if: ${{ steps.release.outputs.release_created }}
        run: |
          if npm publish; then
            echo "Published via OIDC Trusted Publishing."
          else
            echo "::warning::OIDC publish failed — retrying with the NPM_TOKEN fallback."
            NODE_AUTH_TOKEN="${{ secrets.NPM_TOKEN }}" npm publish
          fi
