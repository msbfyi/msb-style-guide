name: Publish to npm

# Manual-only: the real publish happens automatically as part of
# release-please.yml itself, right after it creates a release — a
# release created by that job's own GITHUB_TOKEN doesn't fire this
# workflow's `on: release` the way a human- or PAT-authored release
# would (GitHub's anti-recursion safeguard for token-authored events),
# so that trigger doesn't work here and isn't declared. This exists
# only to retry a failed publish for a version that already released,
# without needing a whole new release to force it.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
