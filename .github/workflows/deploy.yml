name: "Deploy Storybook to Cloudflare"
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Build and deploy Storybook
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci
      - run: npm run build-storybook

      # calm-king-8ecf (style-guide.msb.fyi) is a Cloudflare Worker with
      # static-assets support, not a Cloudflare Pages project — this was
      # cloudflare/pages-action before, which calls the Pages API and 404s
      # on a Worker regardless of correct credentials. wrangler deploy
      # targets Workers directly; the project/asset config lives in
      # wrangler.jsonc, not as inputs here.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
