name: CI
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run build-storybook

  storybook-tests:
    # Interaction tests (play functions) and visual regression
    # (jest-image-snapshot baselines in .storybook/__image_snapshots__/,
    # committed to the repo). On a real visual diff, download this job's
    # "storybook-test-diff-output" artifact to see the before/after/diff
    # PNGs — jest-image-snapshot writes them under __diff_output__/,
    # which isn't committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # CI=false: @storybook/test-runner (via Jest) auto-detects the
      # GitHub Actions environment and, by default, hard-fails any story
      # with no existing baseline instead of writing one — so a PR that
      # adds a brand-new story always shows a red X here even though
      # nothing is actually broken, just not-yet-baselined. With CI=false,
      # a *new* story writes its screenshot and passes (nothing to compare
      # against yet — this run's filesystem is discarded, nothing gets
      # committed from here); a story with an *existing* baseline still
      # fails hard on a real mismatch, unchanged. Verified locally: 15
      # new-story writes all passed, 2 existing-baseline mismatches still
      # failed. Real baselines only ever get committed by the separate
      # update-visual-snapshots workflow, same as always.
      - run: npm run test:storybook
        env:
          CI: false
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-test-diff-output
          path: .storybook/__image_snapshots__/__diff_output__/
          if-no-files-found: ignore
